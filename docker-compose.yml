services:
  mongo:
    image: mongo:6.0
    container_name: mindful_mongo
    restart: unless-stopped
    ports:
      - "0.0.0.0:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: mindful_app
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      MONGODB_URI: mongodb://mongo:27017/mindfullearning
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me-please-0123456789}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      NODE_ENV: development
      PORT: 5010
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/public/uploads
      - backend_logs:/app/logs

volumes:
  mongo_data:
  backend_uploads:
  backend_logs:
