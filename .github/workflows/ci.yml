name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint backend
        working-directory: backend
        run: npx eslint src/ --max-warnings 50
      - name: Lint frontend
        working-directory: frontend
        run: npx eslint src/ --max-warnings 780

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Backend tests
        working-directory: backend
        run: npx vitest run --reporter=verbose
        env:
          NODE_ENV: test
      - name: Frontend tests
        working-directory: frontend
        run: npx vitest run --reporter=verbose

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and run Docker test suite
        run: docker build --target cicd -t mindful-citest . && docker run --rm mindful-citest
